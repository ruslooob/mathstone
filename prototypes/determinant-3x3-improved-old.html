<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Улучшенный старый — определитель 3 × 3</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23285c45'/%3E%3Ctext x='16' y='23' text-anchor='middle' fill='white' font-size='23'%3EM%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; color: #263a32; background: #f5f4ef; --positive: #286349; --negative: #b45a30; --muted: #747d74; --line: #dedfd5; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.5; }
    button, input { font: inherit; }
    button { cursor: pointer; color: inherit; }
    button:disabled { opacity: .35; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 3px solid #91a87d; outline-offset: 4px; }
    main { max-width: 1160px; margin: auto; padding: 46px 36px 40px; }
    .panel { background: #fffef9; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    .stage { display: grid; grid-template-columns: .85fr 1.15fr; min-height: 340px; }
    .matrix-area { padding: 32px 24px; display: grid; align-content: center; justify-items: center; border-right: 1px solid var(--line); }
    .matrix-area svg { width: 100%; max-width: 310px; overflow: visible; }
    .bracket { fill: none; stroke: #7c8b7d; stroke-width: 2; }
    .path { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .matrix-number { font-size: 30px; fill: #263a32; text-anchor: middle; dominant-baseline: central; }
    .explanation { padding: 33px 34px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .calculation { font-size: clamp(23px, 3vw, 30px); font-variant-numeric: tabular-nums; min-height: 46px; letter-spacing: -.025em; }
    .positive { color: var(--positive); }
    .negative { color: var(--negative); }
    .calculation-result { display: inline-block; font-weight: 600; }
    .accumulator { border-top: 1px solid var(--line); padding-top: 19px; margin-top: 28px; }
    .accumulator-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .expression { position: relative; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-height: 44px; font-size: 26px; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
    .term { white-space: nowrap; display: inline-flex; gap: 8px; align-items: baseline; }
    .seed { color: #99a094; }
    .answer { font-weight: 600; color: var(--positive); background: #e8eee1; padding: 0 9px; border-radius: 5px; }
    .flying-result { position: fixed; top: 0; left: 0; pointer-events: none; font-size: 30px; line-height: 1.5; font-weight: 600; transform-origin: top left; z-index: 5; }
    .controls { border-top: 1px solid var(--line); padding: 21px 28px 23px; background: #fafbf5; }
    .seek-row { display: flex; align-items: center; gap: 16px; }
    input[type="range"] { width: 100%; accent-color: var(--positive); cursor: pointer; height: 24px; margin: 0; }
    .time { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .buttons { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 15px; }
    .transport { display: flex; gap: 8px; flex-wrap: wrap; }
    .button { background: #fffef9; border: 1px solid var(--line); border-radius: 8px; padding: 9px 15px; font-size: 13px; }
    .button:hover:not(:disabled) { background: #eef1e7; }
    .button.primary { background: #285c45; border-color: #285c45; color: white; min-width: 90px; }
    .button.primary:hover { background: #214d3a; }
    .counter { color: var(--muted); font-size: 12px; }
    .steps { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 20px; }
    .step { background: transparent; border: 1px solid var(--line); border-radius: 9px; text-align: left; padding: 9px 10px; min-height: 63px; }
    .step small { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
    .step span { font-size: 12px; }
    .step[aria-current="step"] { border-color: #709375; background: #e8eee1; }
    @media (max-width: 700px) {
      main { padding: 24px 16px; }
      .stage { grid-template-columns: 1fr; }
      .matrix-area { border-right: 0; border-bottom: 1px solid var(--line); padding: 20px; }
      .matrix-area svg { max-width: 235px; }
      .explanation { padding: 24px 22px; min-height: 180px; }
      .expression { font-size: 24px; }
      .controls { padding: 16px; }
      .buttons { gap: 15px; }
      .button { padding: 9px 12px; }
      .steps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <!-- Локальная проба №1: помогает ли раздельное вычисление и перенос произведения понять накопление выражения? -->
  <main>
    <section class="panel" aria-label="Пошаговое вычисление определителя">
      <div class="stage">
        <div class="matrix-area">
          <svg id="matrix" viewBox="0 0 320 300" role="img" aria-label="Матрица A: первая строка 2, 1, 3; вторая строка 1, 0, 2; третья строка 3, 2, 1">
            <title>Матрица A размером 3 на 3</title>
            <text x="3" y="150" font-size="22" fill="#747d74">A =</text>
            <path class="bracket" d="M65 30 H55 V268 H65 M295 30 H305 V268 H295"/>
            <path id="triple-path" class="path" pathLength="1"/>
            <g id="matrix-nodes"></g>
          </svg>
        </div>
        <div class="explanation">
          <div class="calculation" id="calculation" aria-label="Текущее произведение"></div>
          <div class="accumulator" id="accumulator">
            <div class="accumulator-label">Результат</div>
            <div class="expression" id="expression" aria-label="Результат"></div>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="seek-row">
          <input id="seek" type="range" min="0" step="1" value="0" aria-label="Время анимации">
          <span class="time" id="time"></span>
        </div>
        <div class="buttons">
          <div class="transport">
            <button type="button" class="button" id="previous">Назад</button>
            <button type="button" class="button primary" id="play">Пуск</button>
            <button type="button" class="button" id="next">Далее</button>
            <button type="button" class="button" id="restart">Сначала</button>
          </div>
          <span class="counter" id="counter" aria-live="polite"></span>
        </div>
      </div>
    </section>
    <nav class="steps" id="steps" aria-label="Шаги вычисления"></nav>
  </main>
  <span id="flying-result" class="flying-result" aria-hidden="true" hidden></span>
  <script>
    // Данные независимого прототипа. Приложение и его состояние здесь не используются.
    const matrix = [[2, 1, 3], [1, 0, 2], [3, 2, 1]];
    const flat = matrix.flat();
    const triples = [
      { indexes: [0, 4, 8], sign: 1 },
      { indexes: [1, 5, 6], sign: 1 },
      { indexes: [2, 3, 7], sign: 1 },
      { indexes: [2, 4, 6], sign: -1 },
      { indexes: [0, 5, 7], sign: -1 },
      { indexes: [1, 3, 8], sign: -1 },
    ].map((triple) => ({ ...triple, factors: triple.indexes.map((index) => flat[index]),
      product: triple.indexes.reduce((product, index) => product * flat[index], 1) }));
    const answer = triples.reduce((sum, triple) => sum + triple.sign * triple.product, 0);
    const steps = [
      { kind: 'intro', duration: 2400, name: 'Задача', detail: 'det A = ?' },
      ...triples.flatMap((triple, index) => [
        { kind: 'compute', triple: index, duration: 3200, name: `${index + 1}. Вычислить`, detail: triple.factors.join(' × ') },
        { kind: 'transfer', triple: index, duration: 2400, name: `${index + 1}. Записать`, detail: `${triple.sign > 0 ? '+' : '−'} ${triple.product}` },
      ]),
      { kind: 'final', duration: 2600, name: 'Ответ', detail: `det A = ${answer}` },
    ];
    let duration = 0;
    steps.forEach((step) => { step.start = duration; duration += step.duration; });
    const byId = (id) => document.getElementById(id);
    const clamp = (value) => Math.min(1, Math.max(0, value));
    const ease = (value) => { const t = clamp(value); return t * t * (3 - 2 * t); };
    const numberText = (number) => String(number).replace('-', '−');
    const coords = flat.map((_, index) => [95 + (index % 3) * 82, 67 + Math.floor(index / 3) * 82]);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let position = 0;
    let playing = false;
    let lastTimestamp = null;
    let request = null;
    let animationEnd = duration;
    let renderedStep = -1;
    const stepButtons = [];
    byId('seek').max = duration;
    byId('matrix-nodes').innerHTML = coords.map(([x, y], index) =>
      `<g><circle id="node-${index}" cx="${x}" cy="${y}" r="26" fill="#fffef9" stroke="transparent"/><text class="matrix-number" x="${x}" y="${y}">${flat[index]}</text></g>`).join('');
    steps.forEach((step, index) => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'step';
      button.innerHTML = `<span>${index + 1}</span><small>${step.detail}</small>`;
      button.setAttribute('aria-label', `Шаг ${index + 1}: ${step.name}, ${step.detail}`);
      button.addEventListener('click', () => goToStep(index));
      byId('steps').append(button); stepButtons.push(button);
    });

    function currentStep() {
      return Math.max(0, steps.findLastIndex((step) => position >= step.start));
    }

    function termMarkup(triple, index, pending) {
      const sign = index === 0 ? '' : (triple.sign > 0 ? '+' : '−');
      return `<span class="term ${triple.sign > 0 ? 'positive' : 'negative'}"${pending ? ' id="pending-term"' : ''}><span>${sign}</span><span${pending ? ' id="destination"' : ''}>${numberText(triple.product)}</span></span>`;
    }

    function buildStep(index) {
      const step = steps[index];
      const triple = triples[step.triple];
      const signClass = triple?.sign < 0 ? 'negative' : 'positive';
      byId('calculation').className = `calculation ${signClass}`;
      byId('accumulator').hidden = step.kind === 'intro';
      if (step.kind === 'intro') {
        byId('calculation').textContent = 'det A = ?';
      } else if (step.kind === 'final') {
        byId('calculation').innerHTML = `det A = <span id="final-value" class="calculation-result">${numberText(answer)}</span>`;
      } else {
        byId('calculation').innerHTML = `${triple.factors.join(' × ')} <span id="equals">=</span> <span id="source-result" class="calculation-result">${numberText(triple.product)}</span>`;
      }
      const completed = step.kind === 'final' ? triples.length : (step.triple ?? 0);
      let expression = triples.slice(0, completed).map((item, termIndex) => termMarkup(item, termIndex, false)).join('');
      if (step.kind === 'transfer') {
        if (step.triple === 0) expression = '<span id="initial-zero" class="seed" style="position:absolute">0</span>';
        expression += termMarkup(triple, step.triple, true);
      }
      if (!expression) expression = '<span class="seed">0</span>';
      if (step.kind === 'final') expression += `<span id="answer" class="answer">= ${numberText(answer)}</span>`;
      byId('expression').innerHTML = expression;
      const path = byId('triple-path');
      if (triple) {
        const points = triple.indexes.map((item) => coords[item]);
        const triangle = step.triple % 3 !== 0;
        path.setAttribute('d', points.map(([x, y], pointIndex) => `${pointIndex ? 'L' : 'M'} ${x} ${y}`).join(' ') + (triangle ? ' Z' : ''));
        path.style.stroke = triple.sign > 0 ? '#286349' : '#b45a30';
      } else { path.setAttribute('d', ''); }
      stepButtons.forEach((button, buttonIndex) => {
        if (buttonIndex === index) button.setAttribute('aria-current', 'step');
        else button.removeAttribute('aria-current');
      });
      byId('counter').textContent = `Шаг ${index + 1} из ${steps.length}`;
      byId('previous').disabled = index === 0;
      byId('next').disabled = index === steps.length - 1;
      renderedStep = index;
    }

    function render() {
      const index = currentStep();
      const step = steps[index];
      const progress = clamp((position - step.start) / step.duration);
      const motion = reducedMotion.matches ? 1 : progress;
      const triple = triples[step.triple];
      if (renderedStep !== index) buildStep(index);
      const lineProgress = step.kind === 'compute' ? ease(motion / .48) : 1;
      byId('triple-path').style.strokeDasharray = '1';
      byId('triple-path').style.strokeDashoffset = 1 - lineProgress;
      coords.forEach((_, nodeIndex) => {
        const order = triple?.indexes.indexOf(nodeIndex) ?? -1;
        const amount = order < 0 ? 0 : (step.kind === 'compute' ? ease((motion - order * .12) / .2) : 1);
        const node = byId(`node-${nodeIndex}`);
        node.style.fill = triple?.sign < 0 ? `rgba(242, 214, 191, ${amount})` : `rgba(220, 234, 208, ${amount})`;
        node.style.stroke = amount > 0 ? (triple.sign > 0 ? '#91b18c' : '#cf9b77') : 'transparent';
      });
      const source = byId('source-result');
      const flying = byId('flying-result');
      flying.hidden = true;
      if (step.kind === 'compute') {
        const visible = ease((motion - .48) / .2);
        byId('equals').style.opacity = visible;
        source.style.opacity = visible;
      }
      if (step.kind === 'transfer') {
        const travel = ease((motion - .12) / .64);
        const pending = byId('pending-term');
        const destination = byId('destination');
        pending.style.opacity = travel >= 1 ? '1' : '0';
        source.style.opacity = travel > 0 && travel < 1 ? '0' : '1';
        if (byId('initial-zero')) byId('initial-zero').style.opacity = travel >= 1 ? '0' : '1';
        if (travel > 0 && travel < 1) {
          const from = source.getBoundingClientRect();
          const to = destination.getBoundingClientRect();
          const x = from.left + (to.left - from.left) * travel;
          const y = from.top + (to.top - from.top) * travel - Math.sin(travel * Math.PI) * 23;
          const scale = 1 + (to.height / from.height - 1) * travel;
          flying.textContent = numberText(triple.product);
          flying.className = `flying-result ${triple.sign > 0 ? 'positive' : 'negative'}`;
          flying.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
          flying.hidden = false;
        }
      }
      if (step.kind === 'final') {
        const visible = ease((motion - .25) / .35);
        byId('answer').style.opacity = visible;
        byId('final-value').style.opacity = visible;
      }
      byId('seek').value = position;
      byId('seek').setAttribute('aria-valuetext', `Шаг ${index + 1} из ${steps.length}, ${step.name}`);
      byId('time').textContent = `${(position / 1000).toFixed(1)} / ${(duration / 1000).toFixed(1)} с`;
      byId('play').textContent = playing ? 'Пауза' : 'Пуск';
      byId('play').setAttribute('aria-pressed', String(playing));
    }

    function stop() {
      playing = false; lastTimestamp = null;
      if (request !== null) cancelAnimationFrame(request);
      request = null;
    }

    function tick(timestamp) {
      if (!playing) return;
      if (lastTimestamp !== null) position = Math.min(animationEnd, position + timestamp - lastTimestamp);
      lastTimestamp = timestamp;
      if (position >= animationEnd) stop();
      render();
      if (playing) request = requestAnimationFrame(tick);
    }

    function toggle() {
      if (playing) { stop(); render(); return; }
      if (position >= duration - 1) position = 0;
      animationEnd = duration;
      playing = true; lastTimestamp = null;
      render(); request = requestAnimationFrame(tick);
    }

    function goToStep(index) {
      stop();
      const bounded = Math.max(0, Math.min(steps.length - 1, index));
      const step = steps[bounded];
      // При ручном выборе проигрывается только выбранный шаг, затем наступает пауза.
      position = step.start;
      animationEnd = step.start + step.duration - 1;
      playing = bounded !== 0;
      render();
      if (playing) request = requestAnimationFrame(tick);
    }

    byId('play').addEventListener('click', toggle);
    byId('previous').addEventListener('click', () => goToStep(currentStep() - 1));
    byId('next').addEventListener('click', () => goToStep(currentStep() + 1));
    byId('restart').addEventListener('click', () => { stop(); position = 0; render(); });
    byId('seek').addEventListener('input', (event) => { stop(); position = Number(event.target.value); render(); });
    document.addEventListener('keydown', (event) => {
      if (event.target instanceof Element && event.target.closest('input, button, textarea, select, [contenteditable]')) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); goToStep(currentStep() - 1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); goToStep(currentStep() + 1); }
      if (event.code === 'Space') { event.preventDefault(); toggle(); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { stop(); render(); } });
    window.addEventListener('resize', render);
    document.addEventListener('scroll', render, { passive: true });
    render();
  </script>
</body>
</html>
